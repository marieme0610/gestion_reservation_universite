services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: reservation_salles
      DB_USERNAME: reservation_user
      DB_PASSWORD: reservation_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reservation-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "reservation_user",
          "-preservation_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - reservation-network

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: reservation_user
      PMA_PASSWORD: reservation_password
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reservation-network

volumes:
  mysql-data:

networks:
  reservation-network:
    driver: bridge